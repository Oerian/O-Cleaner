# CI —— 三道闸门，全部在 Windows 上跑
#
# 为什么只用 Windows：O-Cleaner 依赖 PowerShell、盘符、%LOCALAPPDATA%、注册表无关的
# 盘符枚举等 Windows 专有机制，在 Linux runner 上跑没有意义。
#
# 为什么 linter 排在功能测试之前：识别规则决定哪些目录会被判定为可清理，
# 规则出错的影响比功能缺陷更直接，因此规则检查先于功能验证。
#
# 提交到 GitHub 时，把整个 .github 目录放在仓库根目录即可。
#
# 运行策略：快慢两级（2026-10-12 起）
#   快 —— lint 作业：编码契约 + .py 语法 + 界面 JS 语法 + 规则 linter + 缺陷注入
#         + 删除护栏矩阵，十秒级。每次推送都跑，几秒内就能知道「文案/规则/编码/
#         护栏有没有写错」。
#   慢 —— test / ui 两个作业：分钟级到十分钟级（test 要给真实清理留时间，
#         ui 要给全盘扫描留几百秒），整条流水线以最慢者为准。它们只在三种情况下运行：
#           1) 每晚定时（UTC 18:00 = 北京时间 02:00）；
#           2) 手动触发（Actions 页面 Run workflow）；
#           3) 提交信息里带 [ci]（想立刻要完整结论时用）。
#   这样日常推送只等快级，完整验证也不会丢。

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  # ---------- 第一道闸门：规则安全（快，每次推送都跑） ----------
  lint:
    name: 规则 linter
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 编码与换行是硬约束：.bat=ASCII+CRLF、.ps1=UTF-8 BOM+CRLF、其余=UTF-8 无 BOM+CRLF。
      # 违反会有真实后果：cmd.exe 解析 LF 的 .bat 会吞行，PowerShell 5.1 把无 BOM 的 .ps1
      # 当 GBK 读会乱码并报 "missing closing brace"（本项目多次遇到）。
      # 以前只靠人工记得跑，现在钉进 CI。
      - name: 编码与换行契约检查
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/fix-encoding.ps1 -Check
          if ($LASTEXITCODE -ne 0) {
            Write-Host "编码/换行不符合契约，请运行 tools/fix-encoding.ps1 修复后重新提交"
            exit 1
          }

      - name: 所有 .py 语法检查
        shell: pwsh
        run: |
          $fail = 0
          Get-ChildItem -Recurse -Filter *.py | ForEach-Object {
            python -m py_compile $_.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "语法错误: $($_.FullName)"; $fail = 1 }
          }
          if ($fail -eq 1) { exit 1 }
          Write-Host "全部 Python 文件语法通过"

      - name: 规则 linter（--strict，警告也算失败）
        run: python -X utf8 tools/lint_rules.py --strict

      # 防止 linter 自身退化成空转：注入已知缺陷，验证它真的抓得到
      - name: 验证 linter 有检出能力
        run: python -X utf8 tools/_lint_selftest.py

      # 删除护栏矩阵：50 项「必须拒绝 / 必须放行」的路径样本 + 规则单元自检。
      # 这是全项目最重要的一道门禁（决定什么能删、什么绝不能删），但它此前只挂在
      # tools/selfcheck.ps1 里，CI 从来没跑过 —— 也就是说护栏退化可以直接合进 main
      # 而没有任何一道闸门会响。它只用标准库 + 临时目录，秒级，放快级闸门里。
      - name: 删除护栏矩阵（必须拒绝 / 必须放行 / 规则单元自检）
        run: python -X utf8 tools/guard_matrix.py

      # 必须检查**全部** script 块：旧版用 [regex]::Match 只取第一个匹配，
      # 而 index.html 的第一个 script 块只有 400 多字节（一小段初始化），
      # 真正 200 KB+ 的应用主体是第二个块 —— 主脚本写坏语法，这道闸门照样绿。
      - name: 界面 JS 语法检查（全部 script 块）
        shell: pwsh
        run: |
          $html = Get-Content web/index.html -Raw -Encoding UTF8
          $ms = [regex]::Matches($html, '(?s)<script[^>]*>(.*?)</script>')
          if ($ms.Count -eq 0) { Write-Host "找不到 <script> 块"; exit 1 }
          $bad = 0
          $i = 0
          foreach ($m in $ms) {
            $i++
            $body = $m.Groups[1].Value
            $p = Join-Path $env:TEMP "oc_ci_$i.js"
            [IO.File]::WriteAllText($p, $body, [Text.UTF8Encoding]::new($false))
            node --check $p
            if ($LASTEXITCODE -ne 0) {
              Write-Host "第 $i 个 script 块语法错误（$($body.Length) 字符）"
              $bad = 1
            } else {
              Write-Host "第 $i 个 script 块语法通过（$($body.Length) 字符）"
            }
          }
          if ($bad -eq 1) { exit 1 }
          Write-Host "全部 $($ms.Count) 个 script 块语法通过"

  # ---------- 第二道闸门：功能自测（慢，定时 / 手动 / 带 [ci] 才跑） ----------
  test:
    name: 自测
    runs-on: windows-latest
    needs: lint
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[ci]') || contains(github.event.head_commit.message, '[CI]')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 自测会在 C:\_ocleaner_selftest 建沙箱并执行真实删除，
      # 并临时替换 config/targets.json（结束时还原）。仅限 CI 环境。
      # 断言条数依机器环境浮动（数据盘数量、是否装有 Steam / WizTree），
      # 绿红不看通过数，看失败数是否为 0。
      - name: 运行自测
        run: python -X utf8 tools/selftest.py

      - name: 失败时上传产物便于排查
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-leftovers
          path: |
            history.json
            schedule.json
            config/targets.json
          if-no-files-found: ignore

  # ---------- 第三道闸门：真实浏览器渲染与交互（慢，同上） ----------
  ui:
    name: 界面渲染检查
    runs-on: windows-latest
    needs: lint
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[ci]') || contains(github.event.head_commit.message, '[CI]')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 启动服务
        shell: pwsh
        run: |
          $p = Start-Process -FilePath python `
            -ArgumentList "-X","utf8","app.py","--port","8801","--no-browser" `
            -PassThru -WindowStyle Hidden
          $p.Id | Out-File -FilePath "$env:TEMP\oc_srv.pid" -Encoding ascii
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              Invoke-RestMethod "http://127.0.0.1:8801/__oc__/state" -TimeoutSec 3 | Out-Null
              Write-Host "服务已就绪"
              exit 0
            } catch { }
          }
          Write-Host "服务启动超时"
          exit 1

      # 用 runner 自带的 Edge 通过 CDP 检查，不安装 playwright（零安装原则）。
      # runner 上没有数据盘，全盘扫描会跑系统盘；cdp_check 内部有 5 分钟上限，
      # 超时只报告跳过，不判失败。
      - name: CDP 渲染与交互检查
        run: node tools/cdp_check.js "http://127.0.0.1:8801"

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: tools/*.png
          if-no-files-found: ignore

      - name: 停止服务
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:TEMP\oc_srv.pid") {
            $serverPid = Get-Content "$env:TEMP\oc_srv.pid"
            Stop-Process -Id $serverPid -Force -ErrorAction SilentlyContinue
          }
          Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
